; ESP32 Boris — OpenClaw Interface
; Board: ESP32-2432S028R (Cheap Yellow Display)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    paulstoffregen/XPT2046_Touchscreen @ ^1.4.0
    blynkkk/Blynk @ ^1.3.2

build_flags =
    -DUSER_SETUP_LOADED
    -DUSER_SETUP_INFO="User_Setup"
